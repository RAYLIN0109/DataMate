services:
  engine:
    container_name: engine
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CORE_PORT:-80}:${CORE_PORT:-80}"
    environment:
      - CORE_PORT=${CORE_PORT:-80}
    command: uvicorn dataherald.app:app --host 0.0.0.0 --port ${CORE_PORT:-80} --log-config log_config.yml --log-level debug --reload
    stdin_open: true
    tty: true
    volumes:
      - ./dataherald:/app/dataherald
    depends_on:
      - mongodb
    networks:
      - dataherald_network
    env_file: .env
  mongodb:
    container_name: mongodb
    image: mongo:6.0
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./initdb.d/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
      - ./dbdata/mongo_data/data:/data/db/
      - ./dbdata/mongo_data/db_config:/data/configdb/
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_DB_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_DB_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGODB_DB_NAME}"
    networks:
      - dataherald_network
  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: always
    ports:
      - "13306:3306"
    volumes:
      - ./initdb.d/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro
      - ./dbdata/mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: dataherald
    networks:
      - dataherald_network
